# Development
# Frontend: http://120.89.33.51:3000
# Usage: docker-compose --env-file .env.dev -f docker-compose.dev.yml up -d --build

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://120.89.33.51:8000/api/v1/}
        VITE_APP_URL: ${VITE_APP_URL:-http://120.89.33.51:3000}
    image: laminar-aviation-app:dev
    container_name: laminar-aviation-frontend-dev
    env_file:
      - .env.dev
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - laminar-network

networks:
  laminar-network:
    driver: bridge
