# UAT (User Acceptance Testing)
# Frontend: http://120.89.33.51:3011
# Usage: docker-compose --env-file .env.uat -f docker-compose.uat.yml up -d --build

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://120.89.33.51:8081/api/v1/}
        VITE_APP_URL: ${VITE_APP_URL:-http://120.89.33.51:3011}
    image: laminar-aviation-app:uat
    container_name: laminar-aviation-frontend-uat
    env_file:
      - .env.uat
    ports:
      - "3011:80"
    environment:
      - NODE_ENV=uat
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - laminar-network

networks:
  laminar-network:
    driver: bridge
